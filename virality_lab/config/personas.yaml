    interests:
      - "Technical depth"
      - "Original research"
      - "Industry case studies"
      - "Actionable frameworks"
    dislikes:
      - "Superficial listicles"
      - "Factual inaccuracies"
      - "Recycled beginner tips"
    description: "Evaluates factual substance, originality, accuracy, and practical utility."
