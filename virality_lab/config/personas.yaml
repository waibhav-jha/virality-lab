      - "Algorithm trends"
    dislikes:
      - "Unbalanced audio"
      - "Lazy template cloning"
      - "Abrupt ending without CTA"
    description: "Analyzes social media mechanics, hook structure, storytelling loops, and production craft."

  - name: "Skeptic"
    age_range: [25, 45]
