      - "Fact checking"
      - "Product teardowns"
      - "Debunking myths"
      - "Critical analysis"
    dislikes:
      - "Exaggerated claims"
      - "Obvious engagement bait"
      - "Fake testimonials"
      - "AI-generated fluff"
    description: "Highly resistant to hype; calls out unsubstantiated claims and demands immediate proof."

  - name: "Niche Expert"
    age_range: [28, 55]
